<!doctype html>
<!--
  Handwritten fixture: section context. A fieldset's legend speaks only for the
  controls inside that fieldset. The ordinary questions AFTER an "Emergency
  contact" or "References" fieldset are the applicant's own and must be filled
  (they used to inherit the legend as context and were ignored). Asserted in
  tests/fixtures.test.js. No external resources.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Section context (fixture)</title>
  <style>
    body { font: 15px/1.4 sans-serif; max-width: 760px; margin: 24px auto; }
    label { display: block; margin: 8px 0; }
  </style>
</head>
<body>
<h1>Apply: Analyst</h1>

<form id="app" action="#" onsubmit="return false">
  <label for="first">First name *</label>
  <input id="first" required>

  <fieldset>
    <legend>Phone</legend>
    <label for="phone">Phone number *</label>
    <input id="phone" type="tel" required>
  </fieldset>

  <!-- After the Phone fieldset: context is NOT "Phone". -->
  <label for="linkedin">LinkedIn Profile</label>
  <input id="linkedin">

  <fieldset>
    <legend>Emergency contact</legend>
    <label for="ec-name">Full name *</label>
    <input id="ec-name" required>
    <label for="ec-phone">Phone *</label>
    <input id="ec-phone" type="tel" required>
  </fieldset>

  <!-- After the emergency-contact fieldset: the applicant's own city and email. -->
  <label for="city">City *</label>
  <input id="city" required>
  <label for="email">Email *</label>
  <input id="email" type="email" required>

  <fieldset>
    <legend>References</legend>
    <label for="ref-name">Name</label>
    <input id="ref-name">
  </fieldset>

  <label for="auth">Are you legally authorized to work in the United States? *</label>
  <select id="auth" required>
    <option value="">Select...</option>
    <option value="1">Yes</option>
    <option value="0">No</option>
  </select>

  <!-- A wrapper fieldset WITHOUT a legend (Avature wraps a whole step): the legend of a
       question nested inside it is not the context of the fields after that question. -->
  <fieldset id="wrap">
    <fieldset>
      <legend>Emergency contact relationship</legend>
      <label><input type="radio" name="ecrel" id="ecrel-parent" value="P"> Parent</label>
      <label><input type="radio" name="ecrel" id="ecrel-other" value="O"> Other</label>
    </fieldset>
    <label for="zip">ZIP code *</label>
    <input id="zip" required>
  </fieldset>

  <h3>Voluntary Self-Identification of Disability</h3>
  <fieldset>
    <legend>Please check one of the boxes below</legend>
    <label><input type="radio" name="dis" id="dis-yes" value="Y"> Yes, I have a disability (or previously had a disability)</label>
    <label><input type="radio" name="dis" id="dis-no" value="N"> No, I do not have a disability and have not had one in the past</label>
    <label><input type="radio" name="dis" id="dis-decline" value="D"> I do not want to answer</label>
  </fieldset>

  <button type="submit">Submit application</button>
</form>
</body>
</html>
